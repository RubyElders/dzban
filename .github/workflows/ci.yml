name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CCACHE_DISABLE: 1
  RUST_BACKTRACE: 1

jobs:
  headless:
    name: Rust / Headless core and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Cargo dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/headless
          key: ${{ runner.os }}-${{ runner.arch }}-headless-1.98.1-${{ hashFiles('**/Cargo.lock') }}
      - name: Build and test without native frontend libraries
        run: bash scripts/test.sh headless

  macos:
    name: macOS / Build and bridge tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Cargo dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/headless
            target/macos-rust
          key: ${{ runner.os }}-${{ runner.arch }}-macos-1.98.1-${{ hashFiles('**/Cargo.lock') }}
      - name: Test shared crates on macOS
        run: bash scripts/test.sh headless
      - name: Test the bridge and Swift package
        run: bash scripts/macos.sh test-bridge
      - name: Build the application and UI tests
        run: |
          bash scripts/macos.sh build-ui-tests
          tar -C target/macos-xcode-fixtures -czf "$RUNNER_TEMP/macos-ui-tests.tgz" Build/Products
      - name: Upload the UI test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-ui-tests
          path: ${{ runner.temp }}/macos-ui-tests.tgz
          retention-days: 1
          if-no-files-found: error

  macos-ui:
    name: macOS / UI tests (shard ${{ matrix.shard }} of 3)
    needs: macos
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the UI test build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-ui-tests
          path: ${{ runner.temp }}
      - name: Unpack the UI test build
        run: |
          mkdir -p target/macos-xcode-fixtures
          tar -C target/macos-xcode-fixtures -xzf "$RUNNER_TEMP/macos-ui-tests.tgz"
      - name: Prepare the desktop
        run: |
          defaults write -g AppleShowScrollBars -string WhenScrolling
          brew install displayplacer
          screen=$(displayplacer list | awk '/^Persistent screen id:/ {print $4; exit}')
          displayplacer "id:$screen res:1920x1080 hz:60 color_depth:7 enabled:true scaling:off origin:(0,0) degree:0"
          bounds=$(osascript -e 'tell application "Finder" to get bounds of window of desktop')
          echo "Desktop bounds: $bounds"
          test "$bounds" = "0, 0, 1920, 1080"
      - name: Test the UI
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/macos.sh test-ui "$SHARD" 3
      - name: Upload failed UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-ui-results-${{ matrix.shard }}
          path: target/macos-ui-results.*/Shell.xcresult
          retention-days: 7
          if-no-files-found: warn

  rust:
    name: Rust / Workspace checks and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Linux build and test tools
        uses: ./.github/actions/setup-linux
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features
      - name: Test the workspace
        run: cargo test --locked --workspace --all-targets

  integration:
    name: Linux / GTK, database and terminal tests
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Linux build and test tools
        uses: ./.github/actions/setup-linux
      - name: Test GTK widgets and lifecycle
        run: bash scripts/test.sh gtk
      - name: Test PostgreSQL, ClickHouse and CLI contracts
        run: bash scripts/test.sh databases
      - name: Clean up database fixtures
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  screens:
    name: Linux / GTK accessibility workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Linux build and test tools
        uses: ./.github/actions/setup-linux
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.9.2
      - name: Verify accessibility test prerequisites
        run: |
          NO_AT_BRIDGE=1 PYTHONPATH=/usr/lib/python3/dist-packages uv run --python /usr/bin/python3 --with dogtail==2.1.0 python -c \
            'from dogtail.hermetic.session import missing_binaries; missing = missing_binaries(); assert not missing, missing'
      - name: Test application screens through AT-SPI
        run: bash scripts/test.sh screens
      - name: Clean up database fixtures
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  secrets:
    name: Quality / Source secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.7
          cache: false
      - name: Scan source
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          gitleaks dir --redact .

  workflows:
    name: Quality / Workflow and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.7
          cache: false
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint
      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n

  ci:
    name: CI / Required checks
    if: always()
    needs: [headless, macos, macos-ui, rust, integration, screens, secrets, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
