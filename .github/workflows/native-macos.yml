name: Native macOS artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: [self-hosted, dzban-macos-native]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and archive tools
        run: rustup toolchain install 1.98.1 --profile minimal --component llvm-tools
      - name: Check the native dependency boundary
        run: bash scripts/test.sh portable
      - name: Check local packaging contracts
        run: python3 -m unittest discover -s tests -p 'test_macos_release.py'
      - name: Build and verify the local unsigned artifact
        run: python3 scripts/macos-release.py target/macos-native-ci
