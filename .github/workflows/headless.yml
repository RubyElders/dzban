name: Headless core and CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    container: rust:1.88-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without native frontend libraries
        run: bash scripts/check-headless.sh
