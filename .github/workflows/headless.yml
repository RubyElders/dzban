name: Headless core and CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    container: rust:1.88-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without native frontend libraries
        run: bash scripts/check-headless.sh

  macos:
    runs-on: macos-14
    strategy:
      matrix:
        rust: ["1.88.0", "1.98.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Build and test without native frontend libraries
        env:
          DZBAN_TEST_TOOLCHAIN: ${{ matrix.rust }}
        run: bash scripts/check-headless.sh
