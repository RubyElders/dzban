name: Set up Linux tests
description: Install native libraries and test tools for Dzban
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
          libgtksourceview-5-dev xvfb xauth dbus-x11 mutter \
          at-spi2-core python3-gi python3-pexpect gir1.2-atspi-2.0 \
          gir1.2-gtk-3.0 gir1.2-gtk-4.0 pspg
        pkg-config --atleast-version=4.18 gtk4
        pkg-config --atleast-version=1.7 libadwaita-1
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview
        rustup default 1.98.1
    - name: Cache Cargo dependencies and builds
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.98.1-${{ hashFiles('**/Cargo.lock') }}
    - name: Fetch locked dependencies for all targets
      shell: bash
      run: cargo +1.98.1 fetch --locked
    - name: Install ShellSpec
      shell: bash
      run: |
        git clone --depth 1 --branch 0.28.1 https://github.com/shellspec/shellspec.git "$RUNNER_TEMP/shellspec"
        test "$(git -C "$RUNNER_TEMP/shellspec" rev-parse HEAD)" = 90e48c950239f3b8a9fdfa3e869592872c77b981
        printf '%s\n' "$RUNNER_TEMP/shellspec" >> "$GITHUB_PATH"
