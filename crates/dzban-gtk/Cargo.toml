[package]
name = "dzban-gtk"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "dzban"
path = "src/main.rs"

[dependencies]
# UI dependencies
gtk4 = { version = "0.10", features = ["gnome_48"] }
libadwaita = { version = "0.8", package = "libadwaita", features = ["v1_7"] }
sourceview5 = { version = "0.10", package = "sourceview5" }
cairo-rs = "0.22"
gdk-pixbuf = "0.22"

# Database layer (our workspace library)
dzban-db = { path = "../dzban-db" }
dzban-core = { path = "../dzban-core" }

# JSON support
serde_json.workspace = true
uuid.workspace = true

# Shared workspace dependencies
glib.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
async-trait.workspace = true
