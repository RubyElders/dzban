[package]
name = "dzban-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "dzb"
path = "src/main.rs"

[dependencies]
dzban-core = { path = "../dzban-core" }
dzban-db = { path = "../dzban-db" }
clap = { version = "=4.5.54", features = ["derive", "env"] }
tokio.workspace = true
serde_json.workspace = true
unicode-width = "0.2.2"
shell-words = "1.1.1"
crossterm = "0.29"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
