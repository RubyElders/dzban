[package]
name = "dzban-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dzban"
path = "src/main.rs"

[dependencies]
# UI dependencies
gtk4 = { version = "0.10", features = ["gnome_48"] }
libadwaita = { version = "0.8", package = "libadwaita", features = ["v1_7"] }
sourceview5 = { version = "0.10", package = "sourceview5" }
cairo-rs = "0.20"
gdk-pixbuf = "0.20"

# Database layer (our workspace library)
dzban-db = { path = "../dzban-db" }

# JSON support
serde_json.workspace = true

# Shared workspace dependencies
glib.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true

# Direct postgres for connection testing (TODO: should use dzban-db)
tokio-postgres.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
