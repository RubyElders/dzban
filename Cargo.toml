[workspace]
resolver = "2"
members = [
    "crates/dzban-db",
    "crates/dzban-gtk",
    "crates/dzban-core",
    "crates/dzban-cli",
    "crates/dzban-macos-bridge",
]

[workspace.dependencies]
# Shared dependencies with locked versions
glib = "0.21"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["runtime", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["native-certs", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip"] }
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
